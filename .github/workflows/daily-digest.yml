name: Daily digest (manual trigger)

# The daily 08:00 Asia/Taipei run is scheduled inside the app itself
# (src/lib/scheduler.ts). This workflow is only a manual remote trigger —
# no `schedule:` here, or the digest would run twice.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the cron endpoint
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron")
          echo "HTTP $code"
          cat /tmp/out.json
          test "$code" = "200"
